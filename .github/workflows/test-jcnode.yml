name: Test JCNode Code Recognition

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/test_jcnode_code.py'
      - '.github/workflows/test-jcnode.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Enable isolated JCNode test
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('sources/jcnode_test.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          data['enabled'] = True
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Run transcript recognition-only test
        run: python scripts/test_jcnode_code.py

      - name: Show test status
        if: always()
        run: echo "JCNode transcript recognition test completed; no source files were modified or published."
