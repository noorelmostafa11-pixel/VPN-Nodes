name: Test JCNode Code Recognition

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install JCNode ASR dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp faster-whisper

      - name: Enable isolated JCNode test
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('sources/jcnode_test.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          data['enabled'] = True
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Run transcript then ASR recognition test
        run: python scripts/test_jcnode_code.py

      - name: Show test status
        if: always()
        run: echo "JCNode recognition test completed; no source files were modified or published."
