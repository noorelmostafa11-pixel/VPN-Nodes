name: Test JCNode Code Recognition

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/test_jcnode_code.py'
      - 'sources/jcnode_test.json'
      - '.github/workflows/test-jcnode.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Deno runtime
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install JCNode ASR dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U --pre yt-dlp faster-whisper
          yt-dlp --version
          deno --version

      - name: Enable isolated JCNode test
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('sources/jcnode_test.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          data['enabled'] = True
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Run transcript then ASR recognition test
        env:
          YTDLP_EXTRACTOR_ARGS: "youtube:player_client=web_safari,default"
        run: python scripts/test_jcnode_code.py

      - name: Show test status
        if: always()
        run: echo "JCNode recognition test completed; no source files were modified or published."
