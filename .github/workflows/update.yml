name: Update node catalog

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Prepare local GeoLite2 database
        run: |
          set -euo pipefail
          mkdir -p data
          if [ ! -s data/GeoLite2-Country.mmdb ]; then
            echo "GeoLite2 database is not committed yet; bootstrapping one local copy for this run."
            curl --fail --location --silent --show-error \
              'https://cdn.jsdelivr.net/npm/geolite2-country/GeoLite2-Country.mmdb.gz' \
              --output /tmp/GeoLite2-Country.mmdb.gz
            gzip -dc /tmp/GeoLite2-Country.mmdb.gz > data/GeoLite2-Country.mmdb
          fi
          test -s data/GeoLite2-Country.mmdb
          ls -lh data/GeoLite2-Country.mmdb

      - name: Run regression tests
        run: |
          set -euo pipefail
          python tests/test_country_resolver.py
          python tests/test_transport_handshake.py
          python -m py_compile scripts/transport_handshake.py scripts/build_tcp_pool.py scripts/merge_and_build_tcp_pool.py

      - name: Build candidates from sources.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/build_sources_candidates.py

      - name: Build candidates from telegram_channels.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/build_telegram_candidates.py

      - name: Build candidates from v2nodes.com
        env:
          V2NODES_WORKERS: 80
          V2NODES_RETRY_WORKERS: 20
          V2NODES_TIMEOUT: 25
          V2NODES_RETRY_TIMEOUT: 30
        run: python scripts/build_v2nodes_candidates.py

      - name: Merge candidates and run TCP plus transport validation
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRANSPORT_HANDSHAKE_WORKERS: 256
          TRANSPORT_HANDSHAKE_TIMEOUT: 2.5
        run: python scripts/merge_and_build_tcp_pool.py

      - name: Show transport validation summary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('output/metadata/transport_handshake.json')
          if not p.is_file():
              raise SystemExit('transport_handshake.json was not generated')
          data = json.loads(p.read_text(encoding='utf-8'))
          print(
              f"TRANSPORT_HANDSHAKE checked={data.get('checked_total', 0)} "
              f"active={data.get('active_handshake_checked', 0)} "
              f"syntax_only={data.get('tcp_syntax_only', 0)} "
              f"passed={data.get('passed_total', 0)} "
              f"rejected={data.get('rejected_total', 0)} "
              f"retry_passed={data.get('retry_passed', 0)} "
              f"elapsed_seconds={data.get('elapsed_seconds', 0)}"
          )
          print('mode_counts=', data.get('mode_counts', {}))
          print('passed_by_mode=', data.get('passed_by_mode', {}))
          print('failed_by_mode=', data.get('failed_by_mode', {}))
          print('top_failure_reasons=', data.get('top_failure_reasons', [])[:10])
          PY

      - name: Verify generated app catalog
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('output/metadata/app_pool.json')
          if not p.is_file():
              raise SystemExit('app_pool.json was not generated')
          data = json.loads(p.read_text(encoding='utf-8'))
          if data.get('mode') != 'tcp_plus_transport_handshake_android_final_runtime_check':
              raise SystemExit(f"unexpected app pool mode: {data.get('mode')}")
          if data.get('final_runtime_test') != 'Android Xray + local HTTP health-check':
              raise SystemExit('unexpected final runtime test marker')
          if data.get('active_directory_generated') is not False:
              raise SystemExit('legacy output/active generation is unexpectedly enabled')
          handshake = data.get('transport_handshake') or {}
          if handshake.get('checked_total') != handshake.get('input_tcp_reachable'):
              raise SystemExit('not every TCP-reachable node entered transport validation')
          print(
              f"OK app_pool published={data.get('published_total', 0)} "
              f"countries={data.get('published_country_nodes', 0)} "
              f"transport_checked={handshake.get('checked_total', 0)} "
              f"transport_rejected={handshake.get('rejected_total', 0)}"
          )
          PY

      - name: Restore previous catalog on failure
        if: failure()
        run: |
          git checkout HEAD -- output/ || true

      - name: Commit generated feeds
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A output
          if git diff --cached --quiet; then
            echo "No catalog changes detected"
            exit 0
          fi
          git commit -m "chore: refresh node catalog"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
