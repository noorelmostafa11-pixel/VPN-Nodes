name: Update node catalog

on:
  push:
    paths:
      - 'scripts/**'
      - 'sources/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/update.yml'
  schedule:
    # Refresh the catalog every 30 minutes, away from the top of the hour.
    - cron: '11,41 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Run regression tests
        run: python tests/test_country_resolver.py

      - name: Expand health check to full parsed pool
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/update_catalog.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('HEALTH_CANDIDATES_PER_COUNTRY = 32\nMIN_CANDIDATES_PER_PROTOCOL = 8\n', '')
          s = s.replace('HEALTH_WORKERS = 32', 'HEALTH_WORKERS = 128')
          a = s.index('def select_health_candidates(rows):')
          b = s.index('\ndef iso_name(code: str)', a)
          s = s[:a] + 'def select_health_candidates(rows):\n    return list(rows)\n\n\n' + s[b + 1:]
          s = s.replace('print(f"INFO parsed={len(rows)} health_candidates={len(candidates)}")', 'print(f"INFO parsed={len(rows)} health_candidates={len(candidates)} full_pool_health_check=true")')
          s = s.replace('"health_policy": "TCP reachability on ports 80/443; final Xray end-to-end Internet verification is performed by the Android client",', '"health_policy": "Every parsed node is TCP-screened on ports 80/443; latency is recorded; Android performs authoritative Xray end-to-end Internet verification",')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Collect and publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update_catalog.py

      - name: Commit generated feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output scripts/update_catalog.py
          git diff --cached --quiet || git commit -m "chore: refresh node catalog"
          git push
