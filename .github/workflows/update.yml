name: Update node catalog

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: catalog-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Prepare local GeoLite2 database
        run: |
          set -euo pipefail
          mkdir -p data
          if [ ! -s data/GeoLite2-Country.mmdb ]; then
            echo "GeoLite2 database is not committed yet; bootstrapping one local copy for this run."
            curl --fail --location --silent --show-error \
              'https://cdn.jsdelivr.net/npm/geolite2-country/GeoLite2-Country.mmdb.gz' \
              --output /tmp/GeoLite2-Country.mmdb.gz
            gzip -dc /tmp/GeoLite2-Country.mmdb.gz > data/GeoLite2-Country.mmdb
          fi
          test -s data/GeoLite2-Country.mmdb
          ls -lh data/GeoLite2-Country.mmdb

      - name: Run regression tests
        run: python tests/test_country_resolver.py

      - name: Build lightweight live-node pool
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/telegram_build_tcp_pool.py

      - name: Verify generated app catalog
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('output/metadata/app_pool.json')
          if not p.is_file():
              raise SystemExit('app_pool.json was not generated')
          data = json.loads(p.read_text(encoding='utf-8'))
          if data.get('mode') != 'tcp_liveness_only_android_final_xray_check':
              raise SystemExit(f"unexpected app pool mode: {data.get('mode')}")
          if data.get('final_runtime_test') != 'Android Xray + local HTTP health-check':
              raise SystemExit('unexpected final runtime test marker')
          print(
              f"OK app_pool published={data.get('published_total', 0)} "
              f"active={data.get('published_active', 0)} "
              f"backup={data.get('published_backup', 0)}"
          )
          PY

      - name: Restore previous catalog on failure
        if: failure()
        run: |
          git checkout HEAD -- output/ || true

      - name: Commit generated feeds
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output
          if git diff --cached --quiet; then
            echo "No catalog changes detected"
            exit 0
          fi
          git commit -m "chore: refresh node catalog"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
