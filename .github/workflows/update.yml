name: Update node catalog

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Prepare local GeoLite2 database
        run: |
          set -euo pipefail
          mkdir -p data
          if [ ! -s data/GeoLite2-Country.mmdb ]; then
            echo "GeoLite2 database is not committed yet; bootstrapping one local copy for this run."
            curl --fail --location --silent --show-error \
              'https://cdn.jsdelivr.net/npm/geolite2-country/GeoLite2-Country.mmdb.gz' \
              --output /tmp/GeoLite2-Country.mmdb.gz
            gzip -dc /tmp/GeoLite2-Country.mmdb.gz > data/GeoLite2-Country.mmdb
          fi
          test -s data/GeoLite2-Country.mmdb
          ls -lh data/GeoLite2-Country.mmdb

      - name: Run regression tests
        run: python tests/test_country_resolver.py

      - name: Build candidates from sources.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/build_sources_candidates.py

      - name: Build candidates from telegram_channels.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/build_telegram_candidates.py

      - name: Build candidates from v2nodes.com
        env:
          V2NODES_WORKERS: 80
          V2NODES_RETRY_WORKERS: 20
          V2NODES_TIMEOUT: 25
          V2NODES_RETRY_TIMEOUT: 30
        run: python scripts/build_v2nodes_candidates.py

      - name: Merge candidates and run common TCP pool
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/merge_and_build_tcp_pool.py

      - name: Install Xray for owned-204 pilot
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p /opt/hostedtoolcache/xray
          curl --fail --location --silent --show-error \
            'https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip' \
            --output /tmp/xray.zip
          unzip -o /tmp/xray.zip xray -d /opt/hostedtoolcache/xray >/dev/null
          chmod +x /opt/hostedtoolcache/xray/xray
          /opt/hostedtoolcache/xray/xray version

      - name: Run non-gating Xray owned-204 pilot
        continue-on-error: true
        env:
          XRAY_BIN: /opt/hostedtoolcache/xray/xray
        run: |
          set -euo pipefail
          python -m py_compile scripts/real_delay.py scripts/xray_owned_204_pilot.py
          python scripts/xray_owned_204_pilot.py \
            --sample 5000 \
            --batch-size 1000 \
            --workers 256 \
            --batch-processes 2 \
            --timeout 3

      - name: Show owned-204 pilot summary
        if: always()
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('output/metadata/xray_probe_experiment.json')
          if not p.is_file():
              print('OWNED_204_PILOT report not generated; catalog publication remains non-gating.')
              raise SystemExit(0)
          data = json.loads(p.read_text(encoding='utf-8'))
          print(
              f"OWNED_204_PILOT pool={data.get('pool_total', 0)} "
              f"parseable={data.get('parseable_total', 0)} "
              f"sampled={data.get('sampled', 0)} "
              f"checked={data.get('checked', 0)} "
              f"passed={data.get('passed', 0)} "
              f"failed={data.get('failed', 0)} "
              f"pass_rate_pct={data.get('pass_rate_pct', 0)} "
              f"retry_passed={data.get('retry_passed', 0)} "
              f"xray_config_failed={data.get('xray_config_failed', 0)} "
              f"elapsed_seconds={data.get('elapsed_seconds', 0)} "
              f"batch_processes={data.get('batch_processes', 1)}"
          )
          print('passed_by_endpoint=', data.get('passed_by_endpoint', {}))
          print('endpoint_attempts=', data.get('endpoint_attempts', {}))
          print('protocol_stats=', data.get('protocol_stats', {}))
          print('top_failure_reasons=', data.get('top_failure_reasons', [])[:10])
          PY

      - name: Upload owned-204 pilot report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: xray-owned-204-pilot
          path: output/metadata/xray_probe_experiment.json
          if-no-files-found: warn
          retention-days: 7

      - name: Verify generated app catalog
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('output/metadata/app_pool.json')
          if not p.is_file():
              raise SystemExit('app_pool.json was not generated')
          data = json.loads(p.read_text(encoding='utf-8'))
          if data.get('mode') != 'tcp_liveness_only_android_final_xray_check':
              raise SystemExit(f"unexpected app pool mode: {data.get('mode')}")
          if data.get('final_runtime_test') != 'Android Xray + local HTTP health-check':
              raise SystemExit('unexpected final runtime test marker')
          if data.get('active_directory_generated') is not False:
              raise SystemExit('legacy output/active generation is unexpectedly enabled')
          print(
              f"OK app_pool published={data.get('published_total', 0)} "
              f"countries={data.get('published_country_nodes', 0)} "
              f"backup={data.get('published_backup', 0)}"
          )
          PY

      - name: Restore previous catalog on failure
        if: failure()
        run: |
          git checkout HEAD -- output/ || true

      - name: Commit generated feeds
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A output
          if git diff --cached --quiet; then
            echo "No catalog changes detected"
            exit 0
          fi
          git commit -m "chore: refresh node catalog"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
