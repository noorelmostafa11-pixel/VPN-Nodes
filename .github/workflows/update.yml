name: Update node catalog

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Prepare local GeoLite2 database
        run: |
          set -euo pipefail
          mkdir -p data
          if [ ! -s data/GeoLite2-Country.mmdb ]; then
            echo "GeoLite2 database is not committed yet; bootstrapping one local copy for this run."
            curl --fail --location --silent --show-error \
              'https://cdn.jsdelivr.net/npm/geolite2-country/GeoLite2-Country.mmdb.gz' \
              --output /tmp/GeoLite2-Country.mmdb.gz
            gzip -dc /tmp/GeoLite2-Country.mmdb.gz > data/GeoLite2-Country.mmdb
          fi
          test -s data/GeoLite2-Country.mmdb
          ls -lh data/GeoLite2-Country.mmdb

      - name: Run regression tests
        run: python tests/test_country_resolver.py

      - name: Build TCP-reachable pool
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/telegram_build_tcp_pool.py

      - name: Distribute unresolved nodes into discovered countries
        run: python scripts/distribute_unknown.py

      - name: Restore previous catalog on failure
        if: failure()
        run: |
          git restore --source=HEAD -- output/countries output/protocols output/global output/metadata/index.json output/metadata/countries.json output/metadata/health.json

      - name: Commit generated feeds
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output
          if git diff --cached --quiet; then
            echo "No catalog changes detected"
            exit 0
          fi
          git commit -m "chore: refresh node catalog"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
