name: Update node catalog
'on':
  workflow_dispatch:
    inputs:
      core_ref:
        description: Owned VPN-Core ref resolved once per run
        type: string
        default: main
      publish_run_id:
        description: Publish saved results from this completed run ID; leave empty for a new scan
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: catalog-refresh-${{ github.ref }}
  cancel-in-progress: false
jobs:
  owned-core:
    if: ${{ !inputs.publish_run_id }}
    name: Build pinned owner core once
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      pipeline_revision: ${{ steps.pin.outputs.revision }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        repository: noorelmostafa11-pixel/VPN-Nodes-Private
        ssh-key: ${{ secrets.VPN_NODES_PRIVATE_READ_KEY }}
        ref: main
        path: catalog-source
        fetch-depth: 0
        persist-credentials: false
    - name: Pin private source once
      id: pin
      shell: bash
      run: echo "revision=$(git -C catalog-source rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    - uses: ./catalog-source/.github/actions/catalog
      with:
        stage: owned-core
        private_revision: ${{ steps.pin.outputs.revision }}
        node_key: ${{ secrets.VPN_NODES_ARTIFACT_KEY_B64 }}
        core_ref: ${{ inputs.core_ref || 'main' }}
        core_token: ${{ secrets.VPN_CORE_READ_TOKEN }}
        core_key: ${{ secrets.VPN_CORE_ARTIFACT_KEY_B64 }}
  candidates:
    if: ${{ !inputs.publish_run_id }}
    needs:
    - owned-core
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        repository: noorelmostafa11-pixel/VPN-Nodes-Private
        ssh-key: ${{ secrets.VPN_NODES_PRIVATE_READ_KEY }}
        ref: ${{ needs.owned-core.outputs.pipeline_revision }}
        path: catalog-source
        fetch-depth: 0
        persist-credentials: false
    - uses: ./catalog-source/.github/actions/catalog
      with:
        stage: candidates
        private_revision: ${{ needs.owned-core.outputs.pipeline_revision }}
        node_key: ${{ secrets.VPN_NODES_ARTIFACT_KEY_B64 }}
        core_key: ${{ secrets.VPN_CORE_ARTIFACT_KEY_B64 }}
  core-check:
    if: ${{ !inputs.publish_run_id }}
    needs:
    - candidates
    - owned-core
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard:
        - 0
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
        - 7
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        repository: noorelmostafa11-pixel/VPN-Nodes-Private
        ssh-key: ${{ secrets.VPN_NODES_PRIVATE_READ_KEY }}
        ref: ${{ needs.owned-core.outputs.pipeline_revision }}
        path: catalog-source
        fetch-depth: 0
        persist-credentials: false
    - uses: ./catalog-source/.github/actions/catalog
      with:
        stage: core-check
        private_revision: ${{ needs.owned-core.outputs.pipeline_revision }}
        node_key: ${{ secrets.VPN_NODES_ARTIFACT_KEY_B64 }}
        core_key: ${{ secrets.VPN_CORE_ARTIFACT_KEY_B64 }}
        country_url: ${{ secrets.VPN_COUNTRY_URL }}
        shard: ${{ matrix.shard }}
  speed-prepare:
    if: ${{ !inputs.publish_run_id }}
    name: Prepare unique successful nodes for speed ranking
    needs:
    - candidates
    - core-check
    - owned-core
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        repository: noorelmostafa11-pixel/VPN-Nodes-Private
        ssh-key: ${{ secrets.VPN_NODES_PRIVATE_READ_KEY }}
        ref: ${{ needs.owned-core.outputs.pipeline_revision }}
        path: catalog-source
        fetch-depth: 0
        persist-credentials: false
    - uses: ./catalog-source/.github/actions/catalog
      with:
        stage: speed-prepare
        private_revision: ${{ needs.owned-core.outputs.pipeline_revision }}
        node_key: ${{ secrets.VPN_NODES_ARTIFACT_KEY_B64 }}
  speed-check:
    if: ${{ !inputs.publish_run_id }}
    name: Download speed (${{ matrix.shard }})
    needs:
    - speed-prepare
    - owned-core
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard:
        - 0
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
        - 7
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        repository: noorelmostafa11-pixel/VPN-Nodes-Private
        ssh-key: ${{ secrets.VPN_NODES_PRIVATE_READ_KEY }}
        ref: ${{ needs.owned-core.outputs.pipeline_revision }}
        path: catalog-source
        fetch-depth: 0
        persist-credentials: false
    - uses: ./catalog-source/.github/actions/catalog
      with:
        stage: speed-check
        private_revision: ${{ needs.owned-core.outputs.pipeline_revision }}
        node_key: ${{ secrets.VPN_NODES_ARTIFACT_KEY_B64 }}
        core_key: ${{ secrets.VPN_CORE_ARTIFACT_KEY_B64 }}
        shard: ${{ matrix.shard }}
  publish:
    needs:
    - candidates
    - core-check
    - speed-prepare
    - speed-check
    - owned-core
    if: ${{ always() && !cancelled() && (inputs.publish_run_id || (needs.candidates.result == 'success' && needs.core-check.result == 'success'
      && needs.speed-prepare.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        path: runner-source
        sparse-checkout: .github/pipeline_context.py
        sparse-checkout-cone-mode: false
        persist-credentials: false
    - name: Resolve trusted private source
      id: context
      env:
        GH_TOKEN: ${{ github.token }}
        SOURCE_RUN_ID: ${{ inputs.publish_run_id }}
        EXPECTED_PIPELINE_REVISION: ${{ needs.owned-core.outputs.pipeline_revision }}
      run: python3 runner-source/.github/pipeline_context.py
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        repository: noorelmostafa11-pixel/VPN-Nodes-Private
        ssh-key: ${{ secrets.VPN_NODES_PRIVATE_WRITE_KEY }}
        ref: ${{ inputs.publish_run_id && 'main' || steps.context.outputs.pipeline_revision }}
        path: catalog-source
        fetch-depth: 0
        persist-credentials: true
    - name: Pin publication implementation once
      id: publish_revision
      shell: bash
      run: echo "revision=$(git -C catalog-source rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    - uses: ./catalog-source/.github/actions/catalog
      with:
        stage: publish
        private_revision: ${{ steps.publish_revision.outputs.revision }}
        node_key: ${{ secrets.VPN_NODES_ARTIFACT_KEY_B64 }}
        publish_run_id: ${{ inputs.publish_run_id }}
        source_run_id: ${{ steps.context.outputs.source_run_id }}
        source_private_revision: ${{ steps.context.outputs.source_pipeline_revision }}
        legacy_source: ${{ steps.context.outputs.legacy_source }}
        signing_key: ${{ secrets.CATALOG_SIGNING_PRIVATE_KEY_B64 }}
