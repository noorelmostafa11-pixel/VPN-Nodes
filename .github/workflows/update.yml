name: Update node catalog

on:
  push:
    paths:
      - 'scripts/**'
      - 'sources/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/update.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Run regression tests
        run: python tests/test_country_resolver.py

      - name: Collect and publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update_catalog.py

      - name: Install Xray core
        run: |
          set -euo pipefail
          mkdir -p /opt/hostedtoolcache/xray
          curl -fsSL -o /tmp/xray.zip https://github.com/XTLS/Xray-core/releases/download/v26.7.28/Xray-linux-64.zip
          unzip -oq /tmp/xray.zip xray -d /opt/hostedtoolcache/xray
          chmod +x /opt/hostedtoolcache/xray/xray
          /opt/hostedtoolcache/xray/xray version

      - name: Real Xray delay test (3200 candidates)
        env:
          XRAY_BIN: /opt/hostedtoolcache/xray/xray
          REAL_DELAY_CANDIDATES: 3200
          REAL_DELAY_WORKERS: 32
          REAL_DELAY_NODE_TIMEOUT: 6
        run: python scripts/real_delay_v2.py

      - name: Commit generated feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output
          if git diff --cached --quiet; then
            echo "No catalog changes detected"
            exit 0
          fi
          git commit -m "chore: refresh node catalog with real delay"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
