name: Update node catalog

on:
  workflow_dispatch:
    inputs:
      core_ref:
        description: Owned VPN-Core-Test ref resolved once per run
        type: string
        default: main

permissions:
  contents: write

concurrency:
  group: catalog-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  owned-core:
    name: Build pinned owner core once
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: noorelmostafa11-pixel/VPN-Core-Test
          ref: ${{ inputs.core_ref }}
          path: owned-core-source
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.1'
          cache-dependency-path: owned-core-source/go.sum
      - name: Compile production nodecheck and record source and binary identity
        working-directory: owned-core-source
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          test -f app/nodecheck/exit_metadata.go
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/owned-core"
          go build -mod=readonly -trimpath -o "$RUNNER_TEMP/owned-core/vpn-core" ./main
          test -z "$(git status --porcelain)"
          CORE_REVISION="$(git rev-parse HEAD)" python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'owned-core'
          with (root / 'vpn-core').open('rb') as stream:
              sha = hashlib.file_digest(stream, 'sha256').hexdigest()
          manifest = {'repository': 'noorelmostafa11-pixel/VPN-Core-Test',
                      'revision': os.environ['CORE_REVISION'], 'source_modified': False,
                      'binary_sha256': sha}
          (root / 'core-build.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owned-core-${{ github.run_id }}
          path: ${{ runner.temp }}/owned-core/
          retention-days: 1
          if-no-files-found: error

  candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Validate catalog integration sources
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/node_identity.py \
            scripts/core_tcp_filter.py \
            scripts/merge_and_build_tcp_pool.py \
            scripts/xray_matrix/build_tcp_candidates.py \
            scripts/xray_matrix/run_shard.py \
            scripts/xray_matrix/finalize_catalog.py \
            scripts/xray_matrix/verify_final_catalog.py \
            scripts/xray_matrix/owned_core.py

      - name: Collect current sources for the owned core
        env:
          GITHUB_TOKEN: ${{ github.token }}
          V2NODES_WORKERS: 80
          V2NODES_RETRY_WORKERS: 20
          V2NODES_TIMEOUT: 25
          V2NODES_RETRY_TIMEOUT: 30
        run: |
          set -euo pipefail

          rm -rf \
            output/country_shards \
            output/active \
            output/backup

          rm -f \
            output/metadata/transport_handshake.json \
            output/metadata/real_delay.json \
            output/metadata/core_driven_health.json \
            output/metadata/staged_health.json \
            output/metadata/xray_probe_experiment.json \
            output/metadata/openvpn_candidates.json \
            output/metadata/health.json

          python tests/test_node_identity.py
          python tests/test_owned_core.py
          python tests/test_exit_country_and_order.py
          python tests/test_shared_tcp_endpoint.py
          python tests/test_gitverse_adapter.py
          python tests/test_source_freshness.py
          python tests/test_source_pipeline.py
          python tests/test_kort0881_adapter.py
          python tests/test_share_daily_adapter.py
          python tests/test_freeproxydb_adapter.py

          python scripts/build_sources_candidates.py
          python scripts/build_telegram_candidates.py
          python scripts/build_v2nodes_candidates.py
          python scripts/xray_matrix/build_tcp_candidates.py

          test -s output/metadata/xray_candidates.json
          test -s output/metadata/source_freshness.json

      - name: Upload immutable candidate snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xray-candidates
          retention-days: 1
          if-no-files-found: error
          path: |
            output/metadata/xray_candidates.json
            output/metadata/source_freshness.json
            output/metadata/*_cache.json

  core-check:
    needs: [candidates, owned-core]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Download candidate snapshot
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: xray-candidates
          path: /tmp/xray-candidates

      - name: Download this run's owned core
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: owned-core-${{ github.run_id }}
          path: ${{ runner.temp }}/owned-core

      - name: Run the same actual connectivity checker as VPN-Core-Test
        env:
          VPN_NODECHECK_COUNTRY_URL: ${{ secrets.VPN_COUNTRY_URL }}
        run: |
          set -euo pipefail
          if [ -z "${VPN_NODECHECK_COUNTRY_URL:-}" ]; then
            echo 'VPN_COUNTRY_URL secret is required' >&2
            exit 1
          fi
          printf '::add-mask::%s\n' "$VPN_NODECHECK_COUNTRY_URL"
          chmod +x "$RUNNER_TEMP/owned-core/vpn-core"
          python scripts/xray_matrix/run_shard.py \
            --input /tmp/xray-candidates/xray_candidates.json \
            --core "$RUNNER_TEMP/owned-core/vpn-core" \
            --core-manifest "$RUNNER_TEMP/owned-core/core-build.json" \
            --output "/tmp/xray-shard-${{ matrix.shard }}" \
            --shard "${{ matrix.shard }}" \
            --shards 8

      - name: Publish checker summary
        if: ${{ always() }}
        run: |
          report="/tmp/xray-shard-${{ matrix.shard }}/nodecheck/summary.md"
          if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload owned-core observations and detailed failures
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xray-shard-${{ matrix.shard }}
          retention-days: 7
          if-no-files-found: error
          path: /tmp/xray-shard-${{ matrix.shard }}/

  publish:
    needs: [candidates, core-check]
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Download candidate snapshot
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: xray-candidates
          path: /tmp/xray-candidates

      - name: Download all eight owned-core shard results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: xray-shard-*
          path: /tmp/xray-results

      - name: Prepare GeoLite2 database for XX-only fallback
        run: |
          set -euo pipefail
          mkdir -p data

          if [ ! -s data/GeoLite2-Country.mmdb ]; then
            curl --fail --location --silent --show-error \
              'https://cdn.jsdelivr.net/npm/geolite2-country/GeoLite2-Country.mmdb.gz' \
              --output /tmp/GeoLite2-Country.mmdb.gz

            gzip -dc /tmp/GeoLite2-Country.mmdb.gz \
              > data/GeoLite2-Country.mmdb
          fi

          test -s data/GeoLite2-Country.mmdb

      - name: Build owned-core verified catalog
        run: |
          set -euo pipefail

          python scripts/xray_matrix/finalize_catalog.py \
            --candidates /tmp/xray-candidates/xray_candidates.json \
            --results-root /tmp/xray-results \
            --source-freshness /tmp/xray-candidates/source_freshness.json \
            --cache-root /tmp/xray-candidates

          python scripts/xray_matrix/verify_final_catalog.py

      - name: Build and sign catalog manifest
        env:
          CATALOG_SIGNING_PRIVATE_KEY_B64: ${{ secrets.CATALOG_SIGNING_PRIVATE_KEY_B64 }}
          REQUIRE_CATALOG_SIGNATURE: '1'
        run: |
          set -euo pipefail
          python scripts/sign_catalog.py
          test -s output/metadata/catalog_manifest.json
          test -s output/metadata/catalog_manifest.sig

      - name: Restore previous catalog on failure
        if: failure()
        run: |
          git checkout HEAD -- output/ || true

      - name: Publish latest catalog snapshot
        if: success()
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Catalog publishing is allowed only from main; refusing to overwrite main from ${GITHUB_REF_NAME}."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          rolling_marker='[rolling-output]'
          head_is_rolling=false

          if git log -1 --pretty=%B HEAD | grep -Fqx -- "${rolling_marker}"; then
            head_is_rolling=true
          fi

          git add -A output

          if git diff --cached --quiet && [ "${head_is_rolling}" = "true" ]; then
            echo "No catalog changes detected"
            exit 0
          fi

          if [ "${head_is_rolling}" = "true" ] && \
             git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            base_commit="$(git rev-parse HEAD^)"
            echo "Reusing existing repository baseline ${base_commit}"
          else
            previous_rolling="$(
              git log \
                --first-parent \
                --format='%H' \
                --grep='\[rolling-output\]' \
                -n 1 \
                HEAD \
                || true
            )"

            baseline_parent=""
            if [ -n "${previous_rolling}" ] && \
               git rev-parse --verify "${previous_rolling}^" >/dev/null 2>&1; then
              baseline_parent="$(git rev-parse "${previous_rolling}^")"
            fi

            baseline_index="$(mktemp)"
            rm -f "${baseline_index}"

            GIT_INDEX_FILE="${baseline_index}" git read-tree HEAD
            GIT_INDEX_FILE="${baseline_index}" \
              git rm -r -f --cached --ignore-unmatch output >/dev/null

            baseline_tree="$(GIT_INDEX_FILE="${baseline_index}" git write-tree)"
            rm -f "${baseline_index}"

            if [ -n "${baseline_parent}" ]; then
              base_commit="$(
                printf '%s\n' 'chore: refresh repository baseline' |
                git commit-tree "${baseline_tree}" -p "${baseline_parent}"
              )"
            else
              base_commit="$(
                printf '%s\n' 'chore: establish repository baseline' |
                git commit-tree "${baseline_tree}"
              )"
            fi

            echo "Created repository baseline ${base_commit}"
          fi

          snapshot_tree="$(git write-tree)"
          snapshot_commit="$(
            printf '%s\n\n%s\n' \
              'chore: refresh node catalog' \
              "${rolling_marker}" |
            git commit-tree "${snapshot_tree}" -p "${base_commit}"
          )"

          echo "Publishing rolling catalog ${snapshot_commit}"
          echo "Baseline: ${base_commit}"

          git push \
            --force-with-lease=refs/heads/main:${GITHUB_SHA} \
            origin \
            "${snapshot_commit}:refs/heads/main"
