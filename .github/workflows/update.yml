name: Update node catalog

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Prepare local GeoLite2 database
        run: |
          set -euo pipefail
          mkdir -p data
          if [ ! -s data/GeoLite2-Country.mmdb ]; then
            echo "GeoLite2 database is not committed yet; bootstrapping one local copy for this run."
            curl --fail --location --silent --show-error \
              'https://cdn.jsdelivr.net/npm/geolite2-country/GeoLite2-Country.mmdb.gz' \
              --output /tmp/GeoLite2-Country.mmdb.gz
            gzip -dc /tmp/GeoLite2-Country.mmdb.gz > data/GeoLite2-Country.mmdb
          fi
          test -s data/GeoLite2-Country.mmdb

      - name: Collect nodes and build TCP-ranked country feeds
        env:
          GITHUB_TOKEN: ${{ github.token }}
          V2NODES_WORKERS: 80
          V2NODES_RETRY_WORKERS: 20
          V2NODES_TIMEOUT: 25
          V2NODES_RETRY_TIMEOUT: 30
        run: |
          set -euo pipefail

          # Remove abandoned experimental outputs before rebuilding the catalog.
          # Keep index.json because Oracle-side automation may use its timestamp.
          rm -rf output/country_shards output/active output/backup
          rm -f \
            output/metadata/transport_handshake.json \
            output/metadata/real_delay.json \
            output/metadata/core_driven_health.json \
            output/metadata/staged_health.json \
            output/metadata/xray_probe_experiment.json \
            output/metadata/openvpn_candidates.json \
            output/metadata/health.json

          python tests/test_country_resolver.py
          python tests/test_node_identity.py
          python -m py_compile \
            scripts/update_catalog.py \
            scripts/country_resolver.py \
            scripts/node_identity.py \
            scripts/build_sources_candidates.py \
            scripts/build_telegram_candidates.py \
            scripts/build_v2nodes_candidates.py \
            scripts/v2nodes_adapter.py \
            scripts/build_tcp_pool.py \
            scripts/merge_and_build_tcp_pool.py \
            scripts/verify_country_feeds.py \
            scripts/sign_catalog.py
          python scripts/build_sources_candidates.py
          python scripts/build_telegram_candidates.py
          python scripts/build_v2nodes_candidates.py
          python scripts/merge_and_build_tcp_pool.py
          python scripts/verify_country_feeds.py

      - name: Verify TCP-only app catalog
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('output/metadata/app_pool.json')
          if not p.is_file():
              raise SystemExit('app_pool.json was not generated')
          data = json.loads(p.read_text(encoding='utf-8'))
          if data.get('mode') != 'tcp_liveness_only_android_final_xray_check':
              raise SystemExit(f"unexpected app pool mode: {data.get('mode')}")
          if data.get('final_runtime_test') != 'Android Xray + local HTTP health-check':
              raise SystemExit('unexpected final runtime test marker')
          if data.get('tcp_workers') != 512:
              raise SystemExit(f"unexpected TCP worker count: {data.get('tcp_workers')}")
          if data.get('allowed_ports') != [53, 80, 443, 853, 8008]:
              raise SystemExit(f"unexpected allowed ports: {data.get('allowed_ports')}")
          if data.get('country_order_policy') != 'latency_ascending_only':
              raise SystemExit(f"unexpected country order policy: {data.get('country_order_policy')}")
          if 'transport_handshake' in data:
              raise SystemExit('transport handshake metadata must not gate publication')
          print(
              f"OK TCP_ONLY published={data.get('published_total', 0)} "
              f"countries={data.get('published_country_nodes', 0)} "
              f"workers={data.get('tcp_workers')} order={data.get('country_order_policy')}"
          )
          PY

      - name: Build and sign catalog manifest
        env:
          CATALOG_SIGNING_PRIVATE_KEY_B64: ${{ secrets.CATALOG_SIGNING_PRIVATE_KEY_B64 }}
        run: python scripts/sign_catalog.py

      - name: Restore previous catalog on failure
        if: failure()
        run: |
          git checkout HEAD -- output/ || true

      - name: Commit generated feeds
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A output
          if git diff --cached --quiet; then
            echo "No catalog changes detected"
            exit 0
          fi
          git commit -m "chore: refresh node catalog"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
