name: Update node catalog

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Run regression tests
        run: python tests/test_country_resolver.py

      - name: Collect and publish node catalog
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update_catalog.py

      - name: Commit generated feeds
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output
          if git diff --cached --quiet; then
            echo "No catalog changes detected"
            exit 0
          fi
          git commit -m "chore: refresh node catalog"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
