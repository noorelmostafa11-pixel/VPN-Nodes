name: Update node catalog

on:
  push:
    paths:
      - 'scripts/**'
      - 'sources/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/update.yml'
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Run regression tests
        run: python tests/test_country_resolver.py

      - name: Apply catalog health and legacy source ranking policy
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/update_catalog.py')
          s = p.read_text(encoding='utf-8')

          # Full-pool health screening; keep this idempotent so scheduled runs
          # never fail merely because the policy has already been applied.
          s = s.replace('HEALTH_CANDIDATES_PER_COUNTRY = 32\nMIN_CANDIDATES_PER_PROTOCOL = 8\n', '')
          s = s.replace('HEALTH_WORKERS = 32', 'HEALTH_WORKERS = 128')

          a = s.index('def select_health_candidates(rows):')
          b = s.index('\ndef iso_name(code: str)', a)
          replacement = 'def select_health_candidates(rows):\n    return list(rows)\n\n\n'
          s = s[:a] + replacement + s[b + 1:]

          # Normalize the country ranking to legacy source priority first,
          # latency second. This handles both the old and already-normalized form.
          old = 'by_country[country].sort(key=lambda r: (r.get("latency_ms", 999999), -r.get("source_priority", 0), r["protocol"], r["host"]))'
          new = 'by_country[country].sort(key=lambda r: (-r.get("source_priority", 0), r.get("latency_ms", 999999), r["protocol"], r["host"]))'
          if old in s:
              s = s.replace(old, new)
          elif new not in s:
              raise SystemExit('ERROR: country ranking expression not found')

          s = s.replace('print(f"INFO parsed={len(rows)} health_candidates={len(candidates)}")', 'print(f"INFO parsed={len(rows)} health_candidates={len(candidates)} full_pool_health_check=true")')
          s = s.replace('"health_policy": "TCP reachability on ports 80/443; final Xray end-to-end Internet verification is performed by the Android client",', '"health_policy": "Every parsed node is TCP-screened on ports 80/443; source priority is preserved before latency; Android performs authoritative Xray end-to-end Internet verification",')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Collect and publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update_catalog.py

      - name: Commit generated feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output scripts/update_catalog.py
          git diff --cached --quiet || git commit -m "chore: refresh node catalog"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
