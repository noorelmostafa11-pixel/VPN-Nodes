name: Update node catalog

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Prepare local GeoLite2 database
        run: |
          set -euo pipefail
          mkdir -p data
          if [ ! -s data/GeoLite2-Country.mmdb ]; then
            echo "GeoLite2 database is not committed yet; bootstrapping one local copy for this run."
            curl --fail --location --silent --show-error \
              'https://cdn.jsdelivr.net/npm/geolite2-country/GeoLite2-Country.mmdb.gz' \
              --output /tmp/GeoLite2-Country.mmdb.gz
            gzip -dc /tmp/GeoLite2-Country.mmdb.gz > data/GeoLite2-Country.mmdb
          fi
          test -s data/GeoLite2-Country.mmdb
          ls -lh data/GeoLite2-Country.mmdb

      - name: Run regression tests
        run: python tests/test_country_resolver.py

      - name: Build TCP-reachable pool
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/telegram_build_tcp_pool.py

      - name: Distribute unresolved nodes into discovered countries
        run: python scripts/distribute_unknown.py

      - name: Install Xray for Internet health trial
        run: |
          set -euo pipefail
          mkdir -p /opt/hostedtoolcache/xray
          curl --fail --location --silent --show-error \
            'https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip' \
            --output /tmp/xray.zip
          unzip -o /tmp/xray.zip xray -d /opt/hostedtoolcache/xray >/dev/null
          chmod +x /opt/hostedtoolcache/xray/xray
          /opt/hostedtoolcache/xray/xray version

      - name: Real Internet health through Xray - all TCP reachable
        env:
          XRAY_BIN: /opt/hostedtoolcache/xray/xray
          REAL_DELAY_WORKERS: 256
          REAL_DELAY_NODE_TIMEOUT: 5
          REAL_DELAY_SOCKS_BASE: 21000
        run: python scripts/real_delay_all.py

      - name: Restore previous catalog on failure
        if: failure()
        run: |
          git restore --source=HEAD -- output/countries output/protocols output/global output/metadata/index.json output/metadata/countries.json output/metadata/health.json output/metadata/real_delay.json

      - name: Commit generated feeds
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output
          if git diff --cached --quiet; then
            echo "No catalog changes detected"
            exit 0
          fi
          git commit -m "chore: refresh node catalog"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
