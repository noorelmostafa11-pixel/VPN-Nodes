name: Update node catalog

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.x

      - name: Install Xray
        run: |
          set -euo pipefail
          mkdir -p /opt/hostedtoolcache/xray
          curl --fail --location --silent --show-error \
            'https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip' \
            --output /tmp/xray.zip
          unzip -o /tmp/xray.zip xray -d /opt/hostedtoolcache/xray >/dev/null
          chmod +x /opt/hostedtoolcache/xray/xray
          /opt/hostedtoolcache/xray/xray version

      - name: Run full FastNodes pipeline
        env:
          XRAY_BIN: /opt/hostedtoolcache/xray/xray
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_AUTH: ${{ secrets.WORKER_AUTH }}
        run: python scripts/run_fastnodes_full.py

      - name: Restore generated feeds on failure
        if: failure()
        run: |
          git checkout HEAD -- output/ state/ || true

      - name: Commit generated feeds and stability state
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add output state
          if git diff --cached --quiet; then
            echo 'No catalog changes detected'
            exit 0
          fi
          git commit -m 'chore: refresh node catalog with FastNodes'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
