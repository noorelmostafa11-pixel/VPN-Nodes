name: Benchmark node engines

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Identical frozen sample size for Xray and Mihomo'
        required: false
        default: '500'
      workers:
        description: 'Parallel probe workers'
        required: false
        default: '80'
      timeout:
        description: 'Per-node probe timeout in seconds'
        required: false
        default: '5'

permissions:
  contents: write

concurrency:
  group: engine-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Prepare local GeoLite2 database
        run: |
          set -euo pipefail
          mkdir -p data
          if [ ! -s data/GeoLite2-Country.mmdb ]; then
            curl --fail --location --silent --show-error 'https://cdn.jsdelivr.net/npm/geolite2-country/GeoLite2-Country.mmdb.gz' --output /tmp/GeoLite2-Country.mmdb.gz
            gzip -dc /tmp/GeoLite2-Country.mmdb.gz > data/GeoLite2-Country.mmdb
          fi
          test -s data/GeoLite2-Country.mmdb
      - name: Run regression tests
        run: python tests/test_country_resolver.py
      - name: Build TCP-reachable sample pool
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/telegram_build_tcp_pool.py
      - name: Install Xray and Mihomo
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip, json, pathlib, shutil, tarfile, zipfile
          from urllib.request import Request, urlopen
          root=pathlib.Path('/opt/hostedtoolcache'); root.mkdir(parents=True,exist_ok=True)
          def latest(repo):
              with urlopen(Request(f'https://api.github.com/repos/{repo}/releases/latest',headers={'Accept':'application/vnd.github+json','User-Agent':'AhmedVPN-engine-benchmark'}),timeout=20) as r: return json.load(r)
          def install(repo,out_dir,fixed,kind):
              rel=latest(repo); assets=rel.get('assets',[])
              if kind=='xray':
                  candidates=[a for a in assets if a['name']=='Xray-linux-64.zip']
              else:
                  candidates=[a for a in assets if 'linux-amd64' in a['name'].lower() and not any(x in a['name'].lower() for x in ('.deb','.rpm','windows','darwin','android','arm64','386','freebsd','openbsd'))]
              if not candidates: raise SystemExit(f'No suitable {kind} asset for {repo}: {[a["name"] for a in assets]}')
              asset=candidates[0]
              data=urlopen(Request(asset['browser_download_url'],headers={'User-Agent':'AhmedVPN-engine-benchmark'}),timeout=60).read()
              src=pathlib.Path('/tmp')/asset['name']; src.write_bytes(data); out=pathlib.Path(out_dir); out.mkdir(parents=True,exist_ok=True); target=out/fixed
              if src.suffix=='.zip':
                  with zipfile.ZipFile(src) as z:
                      member=next(n for n in z.namelist() if pathlib.Path(n).name==fixed)
                      target.write_bytes(z.read(member))
              elif src.name.endswith(('.tar.gz','.tgz')):
                  with tarfile.open(src,'r:gz') as t:
                      member=next(m for m in t.getmembers() if pathlib.Path(m.name).name==fixed and m.isfile())
                      target.write_bytes(t.extractfile(member).read())
              elif src.suffix=='.gz':
                  with gzip.open(src,'rb') as f, target.open('wb') as g: shutil.copyfileobj(f,g)
              else: shutil.copyfile(src,target)
              target.chmod(0o755); print(target)
          install('XTLS/Xray-core','/opt/hostedtoolcache/xray','xray','xray')
          install('MetaCubeX/mihomo','/opt/hostedtoolcache/mihomo','mihomo','mihomo')
          PY
      - name: Benchmark Xray vs Mihomo with resource metrics
        env:
          XRAY_BIN: /opt/hostedtoolcache/xray/xray
          MIHOMO_BIN: /opt/hostedtoolcache/mihomo/mihomo
        run: |
          pip install psutil
          python scripts/benchmark_xray_mihomo_resources.py --limit '${{ inputs.limit }}' --workers '${{ inputs.workers }}' --timeout '${{ inputs.timeout }}'
      - name: Upload benchmark result
        uses: actions/upload-artifact@v4
        with:
          name: engine-benchmark-xray-mihomo
          path: |
            output/metadata/engine_benchmark_xray_mihomo.json
            output/metadata/benchmark_sample.txt
          if-no-files-found: error
      - name: Commit benchmark result
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add output/metadata/engine_benchmark_xray_mihomo.json output/metadata/benchmark_sample.txt
          if git diff --cached --quiet; then echo 'No benchmark result changes detected'; exit 0; fi
          git commit -m 'chore: record xray mihomo resource benchmark'
          result_commit=$(git rev-parse HEAD)
          git fetch origin main
          git reset --hard origin/main
          git cherry-pick "$result_commit"
          git push origin HEAD:main
