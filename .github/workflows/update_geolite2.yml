name: Update GeoLite2 Country database
'on':
  workflow_dispatch: {}
  schedule:
  - cron: 17 4 * * 2,5
permissions:
  contents: read
concurrency:
  group: geolite2-refresh
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        repository: noorelmostafa11-pixel/VPN-Nodes-Private
        ssh-key: ${{ secrets.VPN_NODES_PRIVATE_WRITE_KEY }}
        ref: main
        path: catalog-source
        fetch-depth: 0
        persist-credentials: true
    - id: pin
      run: echo "revision=$(git -C catalog-source rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    - uses: ./catalog-source/.github/actions/catalog
      with:
        stage: geo
        private_revision: ${{ steps.pin.outputs.revision }}
        node_key: ${{ secrets.VPN_NODES_ARTIFACT_KEY_B64 }}
