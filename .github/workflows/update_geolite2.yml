name: Update GeoLite2 Country database

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 1,15 * *'

permissions:
  contents: write

concurrency:
  group: geolite2-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Download latest GeoLite2 Country MMDB
        run: |
          set -euo pipefail

          mkdir -p data

          rm -f data/GeoLite2-Country.mmdb

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            'https://cdn.jsdelivr.net/npm/geolite2-country/GeoLite2-Country.mmdb.gz' \
            --output /tmp/GeoLite2-Country.mmdb.gz

          gzip -dc \
            /tmp/GeoLite2-Country.mmdb.gz \
            > data/GeoLite2-Country.mmdb

          test -s data/GeoLite2-Country.mmdb

          ls -lh data/GeoLite2-Country.mmdb

      - name: Record provenance
        run: |
          cat > data/GEOLITE2_SOURCE.md <<'EOF'
          # GeoLite2 Country database

          Local MMDB used by the catalog's offline country classifier.

          Source distribution: https://github.com/wp-statistics/GeoLite2-Country
          CDN: https://cdn.jsdelivr.net/npm/geolite2-country/GeoLite2-Country.mmdb.gz

          The distribution states that this is a GeoLite2 Country database derived from
          MaxMind data. Review the current MaxMind GeoLite2 license/EULA and the
          distributor's terms before redistribution.
          EOF

      - name: Publish latest GeoLite2 snapshot
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "GeoLite2 publishing is allowed only from main; refusing to overwrite main from ${GITHUB_REF_NAME}."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          rolling_marker='[rolling-output]'

          #
          # Only GeoLite2 files are staged by this workflow.
          #
          git add \
            data/GeoLite2-Country.mmdb \
            data/GEOLITE2_SOURCE.md

          if git diff --cached --quiet; then
            echo "GeoLite2 database unchanged"
            exit 0
          fi

          #
          # Save the complete repository tree containing:
          #
          # - updated GeoLite2 files
          # - current output exactly as it exists on main
          #
          updated_full_tree="$(git write-tree)"

          #
          # Determine the clean baseline that exists underneath the current
          # rolling output commit.
          #
          head_is_rolling=false

          if git log -1 --pretty=%B HEAD |
             grep -Fqx -- "${rolling_marker}"; then
            head_is_rolling=true
          fi

          baseline_parent=""

          if [ "${head_is_rolling}" = "true" ] &&
             git rev-parse --verify HEAD^ >/dev/null 2>&1; then

            baseline_parent="$(git rev-parse HEAD^)"

          else

            #
            # Handle normal repository commits that may have been added after
            # the previous rolling output.
            #
            previous_rolling="$(
              git log \
                --first-parent \
                --format='%H' \
                --grep='\[rolling-output\]' \
                -n 1 \
                HEAD \
                || true
            )"

            if [ -n "${previous_rolling}" ] &&
               git rev-parse \
                 --verify "${previous_rolling}^" \
                 >/dev/null 2>&1; then

              baseline_parent="$(
                git rev-parse "${previous_rolling}^"
              )"
            fi
          fi

          #
          # Build the NEW baseline from the updated repository tree,
          # but remove output from that baseline completely.
          #
          baseline_index="$(mktemp)"
          rm -f "${baseline_index}"

          GIT_INDEX_FILE="${baseline_index}" \
            git read-tree "${updated_full_tree}"

          GIT_INDEX_FILE="${baseline_index}" \
            git rm \
              -r \
              -f \
              --cached \
              --ignore-unmatch \
              output \
              >/dev/null

          baseline_tree="$(
            GIT_INDEX_FILE="${baseline_index}" \
              git write-tree
          )"

          rm -f "${baseline_index}"

          #
          # GeoLite2 is a real non-output repository update, so create a new
          # baseline commit for it.
          #
          # If an older clean baseline exists, preserve it as the parent.
          #
          if [ -n "${baseline_parent}" ]; then

            base_commit="$(
              printf '%s\n' \
                'chore: refresh GeoLite2 Country database' |
              git commit-tree \
                "${baseline_tree}" \
                -p "${baseline_parent}"
            )"

          else

            base_commit="$(
              printf '%s\n' \
                'chore: establish GeoLite2 repository baseline' |
              git commit-tree \
                "${baseline_tree}"
            )"

          fi

          #
          # Put the CURRENT output back on top of the new clean baseline.
          #
          # This remains the single rolling-output commit on main.
          #
          snapshot_commit="$(
            printf '%s\n\n%s\n' \
              'chore: publish GeoLite2 refresh with current catalog' \
              "${rolling_marker}" |
            git commit-tree \
              "${updated_full_tree}" \
              -p "${base_commit}"
          )"

          echo "Publishing GeoLite2 baseline ${base_commit}"
          echo "Publishing rolling repository state ${snapshot_commit}"

          git push \
            --force-with-lease=refs/heads/main:${GITHUB_SHA} \
            origin \
            "${snapshot_commit}:refs/heads/main"
