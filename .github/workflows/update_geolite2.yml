name: Update GeoLite2 Country database

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 1 * *'

permissions:
  contents: write

concurrency:
  group: geolite2-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download latest GeoLite2 Country
        env:
          MAXMIND_ACCOUNT_ID: ${{ secrets.MAXMIND_ACCOUNT_ID }}
          MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
        run: |
          set -euo pipefail
          test -n "$MAXMIND_ACCOUNT_ID" || { echo "::error::MAXMIND_ACCOUNT_ID secret is required"; exit 1; }
          test -n "$MAXMIND_LICENSE_KEY" || { echo "::error::MAXMIND_LICENSE_KEY secret is required"; exit 1; }
          rm -rf /tmp/geolite2 data/GeoLite2-Country.mmdb
          mkdir -p /tmp/geolite2 data
          curl --fail --location --silent --show-error \
            --user "$MAXMIND_ACCOUNT_ID:$MAXMIND_LICENSE_KEY" \
            'https://download.maxmind.com/geoip/databases/GeoLite2-Country/download?suffix=tar.gz' \
            --output /tmp/geolite2/geolite2-country.tar.gz
          tar -xzf /tmp/geolite2/geolite2-country.tar.gz -C /tmp/geolite2
          db_path="$(find /tmp/geolite2 -type f -name 'GeoLite2-Country.mmdb' -print -quit)"
          test -n "$db_path" || { echo "::error::GeoLite2-Country.mmdb was not found in the downloaded archive"; exit 1; }
          cp "$db_path" data/GeoLite2-Country.mmdb
          ls -lh data/GeoLite2-Country.mmdb

      - name: Show database timestamp
        run: stat -c '%n %s bytes %y' data/GeoLite2-Country.mmdb

      - name: Commit database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/GeoLite2-Country.mmdb
          if git diff --cached --quiet; then
            echo "GeoLite2 database unchanged"
            exit 0
          fi
          git commit -m "chore: refresh GeoLite2 Country database"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
