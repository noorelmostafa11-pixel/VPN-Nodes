name: Update GeoLite2 Country database

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 1,15 * *'

permissions:
  contents: write

concurrency:
  group: geolite2-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download GeoLite2 Country databases
        run: |
          set -euo pipefail
          rm -rf /tmp/geolite2
          mkdir -p /tmp/geolite2 data
          curl --fail --location --silent --show-error \
            'https://cdn.jsdelivr.net/npm/@ip-location-db/geolite2-country-mmdb/geolite2-country-ipv4.mmdb' \
            --output data/GeoLite2-Country-IPv4.mmdb
          curl --fail --location --silent --show-error \
            'https://cdn.jsdelivr.net/npm/@ip-location-db/geolite2-country-mmdb/geolite2-country-ipv6.mmdb' \
            --output data/GeoLite2-Country-IPv6.mmdb
          test -s data/GeoLite2-Country-IPv4.mmdb
          test -s data/GeoLite2-Country-IPv6.mmdb
          ls -lh data/GeoLite2-Country-*.mmdb

      - name: Record provenance
        run: |
          cat > data/GEOLITE2_SOURCE.md <<'EOF'
          # GeoLite2 Country database

          The catalog uses local GeoLite2 Country MMDB databases at build time.
          IPv4 and IPv6 are stored separately because the maintained distribution
          exposes them as separate MMDB files.

          Source: https://github.com/sapics/ip-location-db
          CDN: https://cdn.jsdelivr.net/npm/@ip-location-db/geolite2-country-mmdb/

          Data license/EULA: GeoLite2 by MaxMind. See the upstream repository
          and current MaxMind GeoLite2 license/EULA before redistribution.
          EOF

      - name: Commit database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/GeoLite2-Country-IPv4.mmdb data/GeoLite2-Country-IPv6.mmdb data/GEOLITE2_SOURCE.md
          if git diff --cached --quiet; then
            echo "GeoLite2 database unchanged"
            exit 0
          fi
          git commit -m "chore: refresh GeoLite2 Country database"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
