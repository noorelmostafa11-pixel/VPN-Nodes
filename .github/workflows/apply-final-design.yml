name: Apply final design changes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor == 'noorelmostafa11-pixel'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply
        run: python scripts/apply_final_design.py
      - name: Remove migration helpers
        run: |
          rm -f scripts/apply_final_design.py
          rm -f .github/workflows/final-design-migration.yml
          rm -f .github/workflows/apply-final-design.yml
      - name: Validate
        run: |
          set -euo pipefail
          python -m py_compile scripts/*.py
          if grep -Rni --include='*.py' --include='*.json' --include='*.yml' --include='*.yaml' 'priority' scripts sources .github; then
            echo 'ERROR: priority reference remains'
            exit 1
          fi
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources/sources.json scripts/update_catalog.py scripts/telegram_build_tcp_pool.py scripts/build_tcp_pool.py scripts/real_delay.py scripts/apply_final_design.py scripts/distribute_unknown.py .github/workflows/update.yml .github/workflows/final-design-migration.yml .github/workflows/apply-final-design.yml README.md
          git commit -m "refactor: finalize xray health publication flow"
          git push origin HEAD:main
